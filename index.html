<!doctype html>
<html lang="th" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Course Planner — วิทยาลัยการคอมพิวเตอร์ มข.</title>
    <script>
      // ตั้งธีมก่อน React โหลด กันหน้าจอกะพริบจากสว่างเป็นมืด (ค่าเริ่มต้น = ฟ้า-ขาว)
      try {
        if (localStorage.getItem('course-planner:theme') === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
